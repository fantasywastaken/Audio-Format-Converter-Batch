[package]
name = "audio-format-converter-batch"
version = "0.1.0"
edition = "2021"
authors = ["fantasywastaken"]
description = "Batch audio format converter (MP3, WAV, FLAC, OGG, M4A, AAC) that wraps ffmpeg with parallel conversion and a live progress bar"
license = "MIT"

[[bin]]
name = "audioconv"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
colored = "2.1"
